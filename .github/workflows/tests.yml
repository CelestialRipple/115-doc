name: Plugin regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest plugins.v2/tencentdoc115library/tests -q
      - run: python -m pytest plugins.v2/pansouaggregate/tests -q
      - run: node --test integrations/test-browser-download.cjs integrations/test-bt4g-results.cjs
      - run: git diff --check
